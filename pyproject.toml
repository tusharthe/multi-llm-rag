[project]
name = "multi-llm-rag"
version = "0.1.0"
description = "Multi-LLM RAG: chat with your documents, compared across OpenAI/Anthropic/Gemini side-by-side, with citations."
requires-python = ">=3.10"
dependencies = [
    "streamlit",
    "langchain",
    "langgraph",
    "langchain-ollama",
    "langchain-openai",
    "langchain-anthropic",
    "langchain-google-genai",
    "langchain-chroma",
    "langchain-community",
    "pypdf",
    "docx2txt",
    "python-dotenv",
]

[project.scripts]
# Run with: uv run reindex --clear   /   uv run reindex --rebuild
reindex = "reindex:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Flat layout: expose the top-level CLI module as the installable content.
[tool.hatch.build.targets.wheel]
only-include = ["reindex.py"]
