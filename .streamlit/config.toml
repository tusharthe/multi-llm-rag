[theme]
# Tokens mirror the Stitch design export (rag_hub_core/DESIGN.md).
base = "light"

primaryColor = "#b7131a"
backgroundColor = "#fcf9f8"
secondaryBackgroundColor = "#f0eded"
textColor = "#1b1c1c"
linkColor = "#006578"
borderColor = "#e5e2e1"
codeBackgroundColor = "#f6f3f2"

# Shape language: 12px base radius on cards/inputs/buttons.
baseRadius = "12px"
buttonRadius = "12px"
showWidgetBorder = true
showSidebarBorder = true

# Inter for body/headings, Geist Mono for technical metadata.
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap"
codeFont = "'Geist Mono':https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap"
baseFontSize = 15
codeFontSize = "13px"
headingFontSizes = ["32px", "24px", "18px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = false

# Status colors used by st.badge and :green-badge[...] markdown.
greenColor = "#15803d"
orangeColor = "#b45309"
redColor = "#b7131a"
blueColor = "#006578"
grayColor = "#8a8686"

# Per-model series colors for the analytics charts.
chartCategoricalColors = ["#10a37f", "#d97757", "#4285f4", "#b7131a", "#006578"]

[theme.sidebar]
backgroundColor = "#f6f3f2"
secondaryBackgroundColor = "#eae7e7"
borderColor = "#e5e2e1"


[browser]
gatherUsageStats = false


[server]
# Automatically re-runs the script when a file is modified on disk
runOnSave = true

# Options: "auto", "watchdog", "poll", or "none"
fileWatcherType = "auto"
